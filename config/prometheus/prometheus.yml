global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Métricas de Aplicação e SpanMetrics vindas do OTel Collector
  - job_name: 'otel-collector-app-metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8889']

  # 2. Métricas de Infraestrutura Interna do próprio OTel Collector (CPU, RAM, Filas, Spans enviados)
  - job_name: 'otel-collector-internal'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8888']

  # 3. Métricas de Infraestrutura do Prometheus (TSDB, Memória, CPU, Goroutines)
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']

  # 4. Métricas de Infraestrutura do Loki (Logs Ingestion, RAM, CPU)
  - job_name: 'loki'
    scrape_interval: 5s
    static_configs:
      - targets: ['loki:3100']

  # 5. Métricas de Infraestrutura do Tempo (Traces Ingestion, RAM, CPU)
  - job_name: 'tempo'
    scrape_interval: 5s
    static_configs:
      - targets: ['tempo:3200']
