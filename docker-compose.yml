services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    volumes:
      - ./ledger-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Serviço B: Ledger Service (Regras Financeiras + Postgres)
  ledger-service:
    build: ./ledger-service
    container_name: ledger-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bank
      OTEL_SERVICE_NAME: ledger-service
      OTEL_SERVICE_VERSION: 1.0.0
      DEPLOYMENT_ENVIRONMENT: local-lab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # 3. Serviço A: Account API (Gateway HTTP + Painel Web + SRE Copilot Gemini)
  account-api:
    build: ./account-api
    container_name: account-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      LEDGER_URL: http://ledger-service:3001
      LOAD_GEN_URL: http://load-gen:3002
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      OTEL_SERVICE_NAME: account-api
      OTEL_SERVICE_VERSION: 1.0.0
      DEPLOYMENT_ENVIRONMENT: local-lab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - ledger-service
      - otel-collector

  # 4. Gerador de Carga Controlável (Liga/Desliga)
  load-gen:
    build: ./load-gen
    container_name: load-gen
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      TARGET_URL: http://account-api:3000
      INTERVAL_MS: 1500
      AUTO_START: "true"
    depends_on:
      - account-api

  # 5. OpenTelemetry Collector (Receptor OTLP e Roteador)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Métricas internas do próprio Collector
      - "8889:8889"   # Prometheus exporter (métricas das aplicações)
    depends_on:
      - tempo
      - loki

  # 6. Tempo (Backend de Traces)
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  # 7. Loki (Backend de Logs)
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  # 8. Prometheus (Backend de Métricas)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # 9. Grafana (Visualização e Correlação)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3003:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
